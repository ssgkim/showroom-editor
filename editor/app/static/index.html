<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showroom Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Showroom Editor</h1>
        <p class="brand-sub" data-i18n="brand.sub"></p>
      </div>
    </div>
    <div class="topbar-right">
      <dl class="cluster">
        <div><dt data-i18n="cluster.label"></dt><dd id="cluster-domain">—</dd></div>
        <div><dt data-i18n="deployed.label"></dt><dd id="deployed-badge"></dd></div>
      </dl>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="panel panel-catalog" aria-labelledby="catalog-heading">
      <header class="panel-head">
        <p class="step">01</p>
        <h2 id="catalog-heading" data-i18n="catalog.heading"></h2>
        <p class="panel-desc" data-i18n="catalog.desc"></p>
      </header>
      <ul id="catalog-list" class="catalog-list"></ul>
      <form id="catalog-form" class="catalog-form" autocomplete="off">
        <h3 data-i18n="catalog.new"></h3>
        <label><span data-i18n="form.name"></span> <span class="hint" data-i18n="form.nameHint"></span>
          <input name="name" required pattern="[a-z0-9][a-z0-9\-]{0,40}" data-i18n-placeholder="ph.name">
        </label>
        <label><span data-i18n="form.repoUrl"></span>
          <input name="repoUrl" required type="url" pattern="https://.+" placeholder="https://github.com/org/workshop.git">
        </label>
        <div class="row">
          <label><span data-i18n="form.ref"></span> <input name="repoRef" value="main" required></label>
          <label><span data-i18n="form.startPath"></span> <input name="startPath" value="content" required></label>
        </div>
        <label><span data-i18n="form.title"></span> <span class="hint" data-i18n="form.titleHint"></span>
          <input name="title" data-i18n-placeholder="ph.title">
        </label>
        <details>
          <summary data-i18n="form.advanced"></summary>
          <label><span data-i18n="form.tabs"></span> <span class="hint" data-i18n="form.tabsHint"></span>
            <textarea name="tabs" rows="2" placeholder="MLflow Console | https://mlflow-server.{{ .domain }}/"></textarea>
          </label>
          <label><span data-i18n="form.attrs"></span> <span class="hint" data-i18n="form.attrsHint"></span>
            <textarea name="attributes" rows="3" placeholder="demo-ns = demo-{{ .user }}"></textarea>
          </label>
        </details>
        <button type="submit" class="btn btn-ink" data-i18n="form.submit"></button>
      </form>
    </section>

    <section class="panel panel-composer" aria-labelledby="composer-heading">
      <header class="panel-head">
        <p class="step">02</p>
        <h2 id="composer-heading" data-i18n="composer.heading"></h2>
        <p class="panel-desc" data-i18n="composer.desc"></p>
      </header>
      <div class="workshop-tabs" id="workshop-tabs" role="tablist"></div>
      <form id="workshop-form" class="workshop-form" autocomplete="off">
        <div class="row">
          <label class="grow"><span data-i18n="ws.title"></span> <input name="title" required maxlength="100" data-i18n-placeholder="ph.wsTitle"></label>
          <label><span data-i18n="ws.id"></span> <input name="id" required pattern="[a-z0-9][a-z0-9\-]{0,40}" data-i18n-placeholder="ph.wsId"></label>
        </div>
        <div class="row">
          <label><span data-i18n="ws.userStart"></span> <input name="userStart" type="number" min="1" value="1" required></label>
          <label><span data-i18n="ws.userCount"></span> <input name="userCount" type="number" min="1" max="200" value="20" required></label>
          <p class="range" id="user-range"></p>
        </div>
        <div class="compose">
          <div>
            <h3><span data-i18n="ws.selected"></span> <span class="count" id="selected-count">0</span></h3>
            <ol id="selected-list" class="selected-list"></ol>
          </div>
          <div>
            <h3 data-i18n="ws.available"></h3>
            <ul id="available-list" class="available-list"></ul>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-ghost" data-i18n="btn.save"></button>
          <button type="button" class="btn btn-ink" id="btn-preview" data-i18n="btn.preview"></button>
          <button type="button" class="btn btn-red" id="btn-deploy" data-i18n="btn.deploy" data-i18n-confirm="confirm.deploy"></button>
          <button type="button" class="btn btn-text danger" id="btn-delete-workshop" data-i18n="btn.deleteWorkshop" data-i18n-confirm="confirm.deleteWorkshop"></button>
        </div>
      </form>
    </section>

    <section class="panel panel-runs" aria-labelledby="runs-heading">
      <header class="panel-head">
        <p class="step">03</p>
        <h2 id="runs-heading" data-i18n="runs.heading"></h2>
      </header>
      <article class="run-card" id="preview-card">
        <div class="run-head">
          <h3 data-i18n="preview.heading"></h3>
          <button type="button" class="btn btn-text danger" data-role-remove="preview" data-i18n="btn.delete" data-i18n-confirm="confirm.removePreview"></button>
        </div>
        <p class="run-meta" id="preview-meta"></p>
        <ul class="status-list" id="preview-status"></ul>
      </article>
      <article class="run-card run-card-deploy" id="deploy-card">
        <div class="run-head">
          <h3 data-i18n="deploy.heading"></h3>
          <div class="run-buttons">
            <button type="button" class="btn btn-text" data-role-restart="deploy" data-i18n="btn.restartAll" data-i18n-confirm="confirm.restart"></button>
            <button type="button" class="btn btn-text danger" data-role-remove="deploy" data-i18n="btn.undeploy" data-i18n-confirm="confirm.undeploy"></button>
          </div>
        </div>
        <p class="run-meta" id="deploy-meta"></p>
        <p class="tally" id="deploy-tally"></p>
        <ul class="status-list status-grid" id="deploy-status"></ul>
      </article>
      <article class="log-card" id="log-card" hidden>
        <div class="run-head">
          <h3 id="log-title" data-i18n="log.title"></h3>
          <button type="button" class="btn btn-text" id="btn-close-log" data-i18n="btn.close"></button>
        </div>
        <pre id="log-body"></pre>
      </article>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
